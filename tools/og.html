<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>OG obrázek</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  .og{position:relative;width:1200px;height:630px;padding:72px 80px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between}
  .og-brand{display:flex;align-items:center;gap:18px;font:500 26px/1 var(--font-sans)}
  .og-brand svg{width:52px;height:52px;color:var(--slate)}
  .og h1{margin:0;font:500 84px/1.02 var(--font-serif);letter-spacing:-.02em;max-width:18ch}
  .og-foot{display:flex;justify-content:space-between;align-items:flex-end;padding-top:28px;border-top:1px solid var(--line-strong);font:400 22px/1.3 var(--font-sans);color:var(--text-2)}
  .og-foot b{font-weight:500;color:var(--ink)}
</style>
</head>
<body>
<div class="og">
  <div class="og-brand">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"><path d="M50 50V13M50 50l31-20M50 50l31 18M50 50v36M50 50L20 62.5"/></g>
      <g fill="currentColor"><circle cx="81" cy="30" r="7"/><circle cx="81" cy="68" r="7"/><circle cx="50" cy="86" r="7"/><circle cx="20" cy="62.5" r="7.4"/><circle cx="50" cy="13" r="7.4"/><circle cx="50" cy="50" r="7"/></g>
      <g fill="#a6d523"><circle cx="50" cy="13" r="2.7"/><circle cx="50" cy="50" r="3.1"/></g>
    </svg>
    <span>Klára Pospíšilová</span>
  </div>
  <h1>Procesy, které dávají smysl. A&nbsp;systém, který je udrží.</h1>
  <div class="og-foot">
    <span><b>Business analytička.</b> Interní informační systémy na míru.</span>
    <span>klarkanis.cz</span>
  </div>
</div>
</body>
</html>
